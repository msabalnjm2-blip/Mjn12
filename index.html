<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>مطعم الكوفية | Al Koufieh Restaurant</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --bg-0:#100d0c;
  --bg-1:#1a1310;
  --bg-2:#221714;
  --ember:#8a2b32;
  --ember-light:#b3444c;
  --sand:#f2e9dc;
  --sand-dim:#c9bfae;
  --hairline:rgba(242,233,220,0.14);
  --glass:rgba(255,255,255,0.055);
  --glass-strong:rgba(255,255,255,0.09);
}

*{box-sizing:border-box;}

html,body{
  margin:0;
  padding:0;
}

body{
  background:
    radial-gradient(ellipse 90% 60% at 15% 0%, rgba(138,43,50,0.20), transparent 60%),
    radial-gradient(ellipse 70% 50% at 100% 20%, rgba(179,68,76,0.12), transparent 55%),
    radial-gradient(ellipse 80% 60% at 50% 100%, rgba(138,43,50,0.10), transparent 60%),
    linear-gradient(180deg, var(--bg-0), var(--bg-1) 40%, var(--bg-2));
  background-attachment:fixed;
  color:var(--sand);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}

html[data-lang="ar"] body{
  font-family:'Cairo',sans-serif;
}

html[data-lang="en"] body,
html[data-lang="tr"] body{
  font-family:'Poppins',sans-serif;
}

button{
  font-family:inherit;
  cursor:pointer;
}

.display{
  font-family:'Cormorant Garamond',serif;
}

html[data-lang="ar"] .display{
  font-family:'Cairo',sans-serif;
  font-weight:700;
}

::selection{
  background:var(--ember);
  color:var(--sand);
}

.mesh{
  position:fixed;
  inset:-20%;
  z-index:0;
  pointer-events:none;
  opacity:0.55;
  background:
    radial-gradient(circle at 20% 30%, rgba(179,68,76,0.18), transparent 35%),
    radial-gradient(circle at 80% 70%, rgba(138,43,50,0.16), transparent 40%);
  animation:drift 22s ease-in-out infinite alternate;
}

@keyframes drift{
  0%{transform:translate(0,0) scale(1);}
  100%{transform:translate(-3%,2%) scale(1.06);}
}

header{
  position:sticky;
  top:0;
  z-index:40;
  background:rgba(16,13,12,0.72);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  border-bottom:1px solid var(--hairline);
}

.brand-mark{
  width:44px;
  height:44px;
  border-radius:50%;
  border:1px solid var(--hairline);
  background:linear-gradient(145deg,var(--glass-strong),var(--glass));
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:'Cormorant Garamond',serif;
  font-weight:600;
  font-size:20px;
  color:var(--ember-light);
  flex-shrink:0;
}

.lang-pill{
  padding:6px 14px;
  border-radius:999px;
  font-size:13px;
  letter-spacing:.02em;
  border:1px solid transparent;
  color:var(--sand-dim);
  transition:all .35s cubic-bezier(.22,1,.36,1);
  cursor:pointer;
  background:transparent;
}

.lang-pill.active{
  background:var(--glass-strong);
  border-color:var(--hairline);
  color:var(--sand);
}

.cat-pill{
  padding:9px 20px;
  border-radius:999px;
  white-space:nowrap;
  border:1px solid var(--hairline);
  background:var(--glass);
  color:var(--sand-dim);
  font-size:14px;
  transition:all .3s ease;
  flex-shrink:0;
  cursor:pointer;
}

.cat-pill.active{
  background:linear-gradient(135deg,var(--ember),var(--ember-light));
  color:#fff5f0;
  border-color:transparent;
  box-shadow:0 8px 24px -8px rgba(138,43,50,0.6);
}

.cat-scroll{
  display:flex;
  gap:10px;
  overflow-x:auto;
  padding:2px 2px 14px 2px;
  scrollbar-width:none;
}

.cat-scroll::-webkit-scrollbar{
  display:none;
}

.card{
  background:linear-gradient(180deg,var(--glass-strong),var(--glass));
  border:1px solid var(--hairline);
  border-radius:22px;
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  overflow:hidden;
  box-shadow:0 20px 40px -24px rgba(0,0,0,0.65);
  transition:transform .45s cubic-bezier(.22,1,.36,1),
             box-shadow .45s ease,
             border-color .45s ease;
  opacity:0;
  transform:translateY(18px);
  animation:riseIn .6s cubic-bezier(.22,1,.36,1) forwards;
}

.card:hover{
  transform:translateY(-6px);
  border-color:rgba(179,68,76,0.45);
  box-shadow:0 28px 50px -20px rgba(0,0,0,0.75);
}

@keyframes riseIn{
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.card-img-wrap{
  position:relative;
  aspect-ratio:4/3;
  overflow:hidden;
}

.card-img-wrap img{
  width:100%;
  height:100%;
  object-fit:cover;
  transition:transform .7s cubic-bezier(.22,1,.36,1);
}

.card:hover .card-img-wrap img{
  transform:scale(1.07);
}

.card-img-wrap::after{
  content:'';
  position:absolute;
  inset:0;
  background:linear-gradient(180deg,transparent 55%,rgba(16,13,12,0.55));
  pointer-events:none;
}

.view-btn{
  position:absolute;
  bottom:12px;
  z-index:2;
  inset-inline-start:12px;
  background:rgba(16,13,12,0.55);
  border:1px solid rgba(242,233,220,0.25);
  backdrop-filter:blur(8px);
  color:var(--sand);
  font-size:12.5px;
  padding:7px 14px;
  border-radius:999px;
  display:flex;
  align-items:center;
  gap:6px;
  transition:background .3s ease;
}

.view-btn:hover{
  background:rgba(138,43,50,0.55);
}

.price{
  font-size:18px;
  font-weight:700;
  color:var(--sand);
  direction:ltr;
  unicode-bidi:isolate;
}

.demo-price{
  font-size:10px;
  color:var(--ember-light);
  margin-top:2px;
}

.add-btn{
  border:0;
  background:linear-gradient(135deg,var(--ember),var(--ember-light));
  color:#fff;
  border-radius:12px;
  padding:9px 13px;
  font-size:12px;
  font-weight:600;
  transition:transform .2s ease,box-shadow .2s ease;
  box-shadow:0 8px 20px -10px rgba(138,43,50,.8);
}

.add-btn:hover{
  transform:translateY(-2px);
}

.add-btn:active{
  transform:scale(.96);
}

/* Modal */

.modal-backdrop{
  position:fixed;
  inset:0;
  z-index:100;
  background:rgba(10,8,7,0.78);
  backdrop-filter:blur(6px);
  display:flex;
  align-items:flex-end;
  justify-content:center;
  opacity:0;
  pointer-events:none;
  transition:opacity .35s ease;
}

.modal-backdrop.open{
  opacity:1;
  pointer-events:auto;
}

@media(min-width:768px){
  .modal-backdrop{
    align-items:center;
  }
}

.modal-panel{
  width:100%;
  max-width:520px;
  max-height:88vh;
  overflow:auto;
  background:linear-gradient(180deg,#1c1512,#140f0d);
  border:1px solid var(--hairline);
  border-radius:26px 26px 0 0;
  transform:translateY(30px);
  transition:transform .4s cubic-bezier(.22,1,.36,1);
}

@media(min-width:768px){
  .modal-panel{
    border-radius:26px;
  }
}

.modal-backdrop.open .modal-panel{
  transform:translateY(0);
}

/* Cart */

.cart-fab{
  position:fixed;
  z-index:70;
  bottom:20px;
  inset-inline-end:20px;
  min-width:58px;
  height:58px;
  padding:0 16px;
  border:1px solid rgba(255,255,255,.15);
  border-radius:999px;
  background:linear-gradient(135deg,var(--ember),var(--ember-light));
  color:white;
  box-shadow:0 15px 35px rgba(0,0,0,.45);
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  font-weight:700;
  transition:transform .25s ease;
}

.cart-fab:hover{
  transform:translateY(-3px);
}

.cart-count{
  min-width:22px;
  height:22px;
  border-radius:50%;
  background:white;
  color:var(--ember);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:11px;
  font-weight:800;
}

.cart-backdrop{
  position:fixed;
  inset:0;
  z-index:110;
  background:rgba(10,8,7,.8);
  backdrop-filter:blur(7px);
  opacity:0;
  pointer-events:none;
  transition:opacity .3s ease;
  display:flex;
  align-items:flex-end;
  justify-content:center;
}

.cart-backdrop.open{
  opacity:1;
  pointer-events:auto;
}

.cart-panel{
  width:100%;
  max-width:560px;
  max-height:90vh;
  overflow:auto;
  background:linear-gradient(180deg,#1c1512,#120d0b);
  border:1px solid var(--hairline);
  border-radius:26px 26px 0 0;
  padding:22px;
  transform:translateY(30px);
  transition:transform .35s ease;
}

.cart-backdrop.open .cart-panel{
  transform:translateY(0);
}

@media(min-width:768px){
  .cart-backdrop{
    align-items:center;
  }

  .cart-panel{
    border-radius:26px;
  }
}

.cart-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:18px;
}

.close-circle{
  width:35px;
  height:35px;
  border-radius:50%;
  background:rgba(255,255,255,.06);
  border:1px solid var(--hairline);
  color:var(--sand);
}

.cart-item{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px 0;
  border-bottom:1px solid var(--hairline);
}

.cart-item-img{
  width:64px;
  height:64px;
  border-radius:12px;
  object-fit:cover;
  flex-shrink:0;
}

.cart-item-info{
  flex:1;
  min-width:0;
}

.cart-item-name{
  font-size:14px;
  color:var(--sand);
  font-weight:600;
}

.cart-item-price{
  margin-top:4px;
  color:var(--sand-dim);
  font-size:12px;
  direction:ltr;
  text-align:start;
}

.qty-controls{
  display:flex;
  align-items:center;
  gap:8px;
}

.qty-btn{
  width:29px;
  height:29px;
  border-radius:50%;
  background:rgba(255,255,255,.07);
  border:1px solid var(--hairline);
  color:var(--sand);
}

.qty-number{
  min-width:18px;
  text-align:center;
  font-size:13px;
}

.table-input{
  width:100%;
  padding:13px 14px;
  margin-top:14px;
  background:rgba(255,255,255,.055);
  border:1px solid var(--hairline);
  border-radius:13px;
  color:var(--sand);
  outline:none;
  font-family:inherit;
}

.table-input:focus{
  border-color:var(--ember-light);
}

.total-box{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:16px 0;
  margin-top:6px;
}

.total-price{
  font-size:22px;
  font-weight:800;
  direction:ltr;
  unicode-bidi:isolate;
}

.whatsapp-btn{
  width:100%;
  border:0;
  padding:14px;
  border-radius:14px;
  background:#25D366;
  color:#071d0e;
  font-weight:800;
  font-size:14px;
  transition:transform .2s ease;
}

.whatsapp-btn:hover{
  transform:translateY(-2px);
}

.clear-btn{
  width:100%;
  margin-top:9px;
  padding:10px;
  border:1px solid var(--hairline);
  border-radius:12px;
  background:transparent;
  color:var(--sand-dim);
  font-family:inherit;
}

.empty-cart{
  text-align:center;
  padding:35px 10px;
  color:var(--sand-dim);
}

.fade-section{
  animation:fadeUp .7s cubic-bezier(.22,1,.36,1) both;
}

@keyframes fadeUp{
  from{
    opacity:0;
    transform:translateY(14px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.empty-state{
  text-align:center;
  padding:60px 20px;
  opacity:0;
  animation:fadeUp .5s ease forwards;
}

.empty-icon{
  width:52px;
  height:52px;
  margin:0 auto 14px;
  border-radius:50%;
  border:1px solid var(--hairline);
  background:var(--glass);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
  color:var(--ember-light);
}

.hero-line{
  width:44px;
  height:1px;
  background:linear-gradient(90deg,transparent,var(--ember-light),transparent);
}

@media(max-width:500px){
  .cart-fab{
    bottom:14px;
    inset-inline-end:14px;
  }
}

@media(prefers-reduced-motion:reduce){
  *{
    animation-duration:.001ms !important;
    transition-duration:.001ms !important;
  }
}
</style>
</head>

<body>

<div class="mesh"></div>

<header>
  <div class="max-w-5xl mx-auto px-5 py-3 flex items-center justify-between gap-4">

    <div class="flex items-center gap-3">
      <div class="brand-mark">ك</div>

      <div>
        <div id="brandName"
             class="display leading-tight text-[19px]"
             style="color:var(--sand)">
          مطعم الكوفية
        </div>

        <div id="brandSub"
             class="text-[11px] tracking-wide"
             style="color:var(--sand-dim)">
          DEMO · القائمة الرقمية
        </div>
      </div>
    </div>

    <div class="flex items-center gap-1 rounded-full p-1"
         style="background:rgba(0,0,0,0.25);border:1px solid var(--hairline)">

      <button class="lang-pill" data-lang="ar">العربية</button>
      <button class="lang-pill" data-lang="tr">Türkçe</button>
      <button class="lang-pill" data-lang="en">English</button>

    </div>

  </div>
</header>


<section class="max-w-5xl mx-auto px-5 pt-10 pb-6 fade-section">

  <div class="hero-line mb-4"></div>

  <h1 id="heroTitle"
      class="display"
      style="font-size:clamp(28px,6vw,44px);line-height:1.15;color:var(--sand);font-weight:600;">
    مذاق أصيل، بأسلوب عصري
  </h1>

  <p id="heroSub"
     class="mt-3"
     style="color:var(--sand-dim);font-size:15px;max-width:32rem;">
    تصفّح أطباقنا واختر ما يناسبك — عرض تجريبي للقائمة الرقمية.
  </p>

</section>


<section class="max-w-5xl mx-auto px-5">
  <div class="cat-scroll" id="catScroll"></div>
</section>


<main class="max-w-5xl mx-auto px-5 pb-24 pt-2">

  <div id="menuGrid"
       class="grid grid-cols-1 sm:grid-cols-2 gap-5">
  </div>

</main>


<footer class="text-center pb-10 px-5"
        style="color:var(--sand-dim);font-size:12px;">

  <div id="footerNote">
    هذا عرض تجريبي لمطعم الكوفية — الأسعار تجريبية فقط.
  </div>

</footer>


<!-- Floating Cart -->

<button class="cart-fab" id="cartFab">

  <span style="font-size:20px;">🛒</span>

  <span id="cartFabText">الطلب</span>

  <span class="cart-count" id="cartCount">0</span>

</button>


<!-- Item Modal -->

<div class="modal-backdrop" id="modalBackdrop">

  <div class="modal-panel" id="modalPanel">

    <div class="relative">

      <div id="modalImgWrap"
           style="aspect-ratio:4/3;overflow:hidden;">

        <img id="modalImg"
             src=""
             alt=""
             style="width:100%;height:100%;object-fit:cover;">

      </div>

      <button id="modalClose"
              class="close-circle"
              style="position:absolute;top:12px;inset-inline-end:12px;">
        ✕
      </button>

    </div>


    <div class="p-6">

      <div id="modalCat"
           class="text-[11px] tracking-wide mb-1"
           style="color:var(--ember-light)">
      </div>

      <h3 id="modalName"
          class="display"
          style="font-size:24px;color:var(--sand);font-weight:600;">
      </h3>

      <div id="modalOriginal"
           class="mt-1 text-[13px]"
           style="color:var(--sand-dim)">
      </div>

      <p id="modalDesc"
         class="mt-3 text-[14px] leading-relaxed"
         style="color:var(--sand-dim)">
      </p>

      <div style="margin-top:18px;display:flex;align-items:center;justify-content:space-between;gap:12px;">

        <div>
          <div id="modalPrice" class="price"></div>
          <div id="modalDemoPrice" class="demo-price"></div>
        </div>

        <button id="modalAddBtn"
                class="add-btn">
          أضف للطلب
        </button>

      </div>

    </div>

  </div>

</div>


<!-- Cart -->

<div class="cart-backdrop" id="cartBackdrop">

  <div class="cart-panel">

    <div class="cart-header">

      <div>
        <div id="cartTitle"
             class="display"
             style="font-size:24px;font-weight:700;color:var(--sand)">
          طلبك
        </div>

        <div id="cartSubtitle"
             style="font-size:11px;color:var(--sand-dim)">
          راجع طلبك قبل الإرسال
        </div>
      </div>

      <button id="cartClose"
              class="close-circle">
        ✕
      </button>

    </div>


    <div id="cartItems"></div>


    <div id="cartForm">

      <input
        id="tableNumber"
        class="table-input"
        type="text"
        inputmode="numeric"
        placeholder="رقم الطاولة">

      <div class="total-box">

        <span id="totalLabel"
              style="color:var(--sand-dim)">
          المجموع
        </span>

        <span id="totalPrice"
              class="total-price">
          $0.00
        </span>

      </div>

      <button id="whatsappBtn"
              class="whatsapp-btn">
        📱 إرسال الطلب عبر WhatsApp
      </button>

      <button id="clearCartBtn"
              class="clear-btn">
        مسح الطلب
      </button>

    </div>

  </div>

</div>

const TEXT = {
