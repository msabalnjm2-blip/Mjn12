<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مطعم الكوفية | Al Koufieh Restaurant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root{
    --bg-0:#100d0c;
    --bg-1:#1a1310;
    --bg-2:#221714;
    --ember:#8a2b32;
    --ember-light:#b3444c;
    --sand:#f2e9dc;
    --sand-dim:#c9bfae;
    --hairline:rgba(242,233,220,0.14);
    --glass:rgba(255,255,255,0.055);
    --glass-strong:rgba(255,255,255,0.09);
  }
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
background:
radial-gradient(ellipse 90% 60% at 15% 0%, rgba(138,43,50,0.20), transparent 60%),
radial-gradient(ellipse 70% 50% at 100% 20%, rgba(179,68,76,0.12), transparent 55%),
radial-gradient(ellipse 80% 60% at 50% 100%, rgba(138,43,50,0.10), transparent 60%),
linear-gradient(180deg, var(--bg-0), var(--bg-1) 40%, var(--bg-2));
background-attachment:fixed;
color:var(--sand);
min-height:100vh;
-webkit-font-smoothing:antialiased;
overflow-x:hidden;
}
html[data-lang="ar"] body{font-family:'Cairo',sans-serif;}
html[data-lang="en"] body,html[data-lang="tr"] body{font-family:'Poppins',sans-serif;}
.display{font-family:'Cormorant Garamond',serif;}
html[data-lang="ar"] .display{font-family:'Cairo',sans-serif; font-weight:700;}

::selection{background:var(--ember); color:var(--sand);}

.mesh{
position:fixed; inset:-20%; z-index:0; pointer-events:none; opacity:0.55;
background:
radial-gradient(circle at 20% 30%, rgba(179,68,76,0.18), transparent 35%),
radial-gradient(circle at 80% 70%, rgba(138,43,50,0.16), transparent 40%);
animation: drift 22s ease-in-out infinite alternate;
}
@keyframes drift{
0%{transform:translate(0,0) scale(1);}
100%{transform:translate(-3%,2%) scale(1.06);}
}

header{
position:sticky; top:0; z-index:40;
background:rgba(16,13,12,0.72);
backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
border-bottom:1px solid var(--hairline);
}

.brand-mark{
width:44px; height:44px; border-radius:50%;
border:1px solid var(--hairline);
background:linear-gradient(145deg, var(--glass-strong), var(--glass));
display:flex; align-items:center; justify-content:center;
font-family:'Cormorant Garamond',serif; font-weight:600; font-size:20px;
color:var(--ember-light);
flex-shrink:0;
}

.lang-pill{
padding:6px 14px; border-radius:999px; font-size:13px; letter-spacing:.02em;
border:1px solid transparent; color:var(--sand-dim);
transition:all .35s cubic-bezier(.22,1,.36,1);
cursor:pointer; background:transparent;
}
.lang-pill.active{
background:var(--glass-strong); border-color:var(--hairline); color:var(--sand);
}

.cat-pill{
padding:9px 20px; border-radius:999px; white-space:nowrap;
border:1px solid var(--hairline); background:var(--glass);
color:var(--sand-dim); font-size:14px; transition:all .3s ease;
flex-shrink:0; cursor:pointer;
}
.cat-pill.active{
background:linear-gradient(135deg, var(--ember), var(--ember-light));
color:#fff5f0; border-color:transparent;
box-shadow:0 8px 24px -8px rgba(138,43,50,0.6);
}
.cat-scroll{
display:flex; gap:10px; overflow-x:auto; padding:2px 2px 14px 2px;
scrollbar-width:none;
}
.cat-scroll::-webkit-scrollbar{display:none;}

.card{
background:linear-gradient(180deg, var(--glass-strong), var(--glass));
border:1px solid var(--hairline);
border-radius:22px;
backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
overflow:hidden;
box-shadow:0 20px 40px -24px rgba(0,0,0,0.65);
transition:transform .45s cubic-bezier(.22,1,.36,1), box-shadow .45s ease, border-color .45s ease;
opacity:0; transform:translateY(18px);
animation:riseIn .6s cubic-bezier(.22,1,.36,1) forwards;
}
.card:hover{
transform:translateY(-6px);
border-color:rgba(179,68,76,0.45);
box-shadow:0 28px 50px -20px rgba(0,0,0,0.75);
}
@keyframes riseIn{ to{opacity:1; transform:translateY(0);} }

.card-img-wrap{ position:relative; aspect-ratio:4/3; overflow:hidden; }
.card-img-wrap img{
width:100%; height:100%; object-fit:cover;
transition:transform .7s cubic-bezier(.22,1,.36,1);
}
.card:hover .card-img-wrap img{ transform:scale(1.07); }
.card-img-wrap::after{
content:''; position:absolute; inset:0;
background:linear-gradient(180deg, transparent 55%, rgba(16,13,12,0.55));
}

.view-btn{
position:absolute; bottom:12px; z-index:2;
inset-inline-start:12px;
background:rgba(16,13,12,0.55);
border:1px solid rgba(242,233,220,0.25);
backdrop-filter:blur(8px);
color:var(--sand); font-size:12.5px; padding:7px 14px; border-radius:999px;
display:flex; align-items:center; gap:6px;
transition:background .3s ease;
}
.view-btn:hover{ background:rgba(138,43,50,0.55); }

.modal-backdrop{
position:fixed; inset:0; z-index:100; background:rgba(10,8,7,0.78);
backdrop-filter:blur(6px);
display:flex; align-items:flex-end; justify-content:center;
opacity:0; pointer-events:none; transition:opacity .35s ease;
}
.modal-backdrop.open{ opacity:1; pointer-events:auto; }
@media(min-width:768px){ .modal-backdrop{ align-items:center; } }

.modal-panel{
width:100%; max-width:520px; max-height:88vh; overflow:auto;
background:linear-gradient(180deg, #1c1512, #140f0d);
border:1px solid var(--hairline);
border-radius:26px 26px 0 0;
transform:translateY(30px); transition:transform .4s cubic-bezier(.22,1,.36,1);
}
@media(min-width:768px){ .modal-panel{ border-radius:26px; } }
.modal-backdrop.open .modal-panel{ transform:translateY(0); }

.fade-section{ animation:fadeUp .7s cubic-bezier(.22,1,.36,1) both; }
@keyframes fadeUp{ from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);} }

.empty-state{
text-align:center; padding:60px 20px; opacity:0;
animation:fadeUp .5s ease forwards;
}
.empty-icon{
width:52px; height:52px; margin:0 auto 14px; border-radius:50%;
border:1px solid var(--hairline); background:var(--glass);
display:flex; align-items:center; justify-content:center;
font-size:22px; color:var(--ember-light);
}

.hero-line{
width:44px; height:1px; background:linear-gradient(90deg, transparent, var(--ember-light), transparent);
}

.price{
font-size:14px; font-weight:700; color:var(--ember-light); margin-top:8px;
}
.add-btn{
margin-top:10px; width:100%; padding:9px; border-radius:12px;
background:linear-gradient(135deg, var(--ember), var(--ember-light));
color:#fff5f0; border:none; font-size:13.5px; cursor:pointer;
transition:transform .2s ease, opacity .2s ease;
}
.add-btn:active{ transform:scale(0.96); }

.cart-fab{
position:fixed; bottom:22px; inset-inline-end:22px; z-index:90;
width:58px; height:58px; border-radius:50%;
background:linear-gradient(135deg, var(--ember), var(--ember-light));
display:flex; align-items:center; justify-content:center;
box-shadow:0 14px 32px -10px rgba(138,43,50,0.75);
cursor:pointer; border:none;
}
.cart-badge{
position:absolute; top:-4px; inset-inline-end:-4px;
background:#fff; color:var(--ember); font-size:11px; font-weight:800;
min-width:21px; height:21px; padding:0 4px; border-radius:999px;
display:flex; align-items:center; justify-content:center;
border:2px solid var(--bg-0);
}
.cart-item-row{
display:flex; align-items:center; gap:8px; padding:12px 0;
border-bottom:1px solid var(--hairline);
}
.qty-btn{
width:26px; height:26px; border-radius:50%; flex-shrink:0;
border:1px solid var(--hairline); background:var(--glass); color:var(--sand);
display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:15px;
}
.remove-btn{
color:var(--ember-light); font-size:12px; cursor:pointer; background:none; border:none; margin-inline-start:4px;
}
.table-input{
width:100%; padding:10px 14px; border-radius:12px; border:1px solid var(--hairline);
background:var(--glass); color:var(--sand); font-size:14px; margin-top:6px;
}
.table-input:focus{ outline:none; border-color:var(--ember-light); }
.whatsapp-btn{
width:100%; padding:13px; border-radius:14px; background:#1f9e52; color:#fff;
border:none; font-size:15px; font-weight:700; cursor:pointer; margin-top:16px;
display:flex; align-items:center; justify-content:center; gap:8px;
transition:opacity .2s ease;
}
.whatsapp-btn:active{ opacity:.85; }

@media (prefers-reduced-motion: reduce){
*{animation-duration:.001ms !important; transition-duration:.001ms !important;}
}
</style>
</head>
<body>
<div class="mesh"></div>
<header>
  <div class="max-w-5xl mx-auto px-5 py-3 flex items-center justify-between gap-4">
    <div class="flex items-center gap-3">
      <div class="brand-mark">ك</div>
      <div>
        <div id="brandName" class="display leading-tight text-[19px]" style="color:var(--sand)">مطعم الكوفية</div>
        <div id="brandSub" class="text-[11px] tracking-wide" style="color:var(--sand-dim)">DEMO · القائمة الرقمية</div>
      </div>
    </div>
    <div class="flex items-center gap-1 rounded-full p-1" style="background:rgba(0,0,0,0.25); border:1px solid var(--hairline)">
      <button class="lang-pill" data-lang="ar">العربية</button>
      <button class="lang-pill" data-lang="tr">Türkçe</button>
      <button class="lang-pill" data-lang="en">English</button>
    </div>
  </div>
</header>
<section class="max-w-5xl mx-auto px-5 pt-10 pb-6 fade-section">
  <div class="hero-line mb-4" id="heroLine"></div>
  <h1 id="heroTitle" class="display" style="font-size:clamp(28px,6vw,44px); line-height:1.15; color:var(--sand); font-weight:600;">
    مذاق أصيل، بأسلوب عصري
  </h1>
  <p id="heroSub" class="mt-3" style="color:var(--sand-dim); font-size:15px; max-width:32rem;">
    تصفّح أطباقنا واختر ما يناسبك — عرض تجريبي للقائمة الرقمية.
  </p>
</section>
<section class="max-w-5xl mx-auto px-5">
  <div class="cat-scroll" id="catScroll"></div>
</section>
<main class="max-w-5xl mx-auto px-5 pb-24 pt-2">
  <div id="menuGrid" class="grid grid-cols-1 sm:grid-cols-2 gap-5"></div>
</main>
<footer class="text-center pb-10 px-5" style="color:var(--sand-dim); font-size:12px;">
  <div id="footerNote">هذا عرض تجريبي لمطعم الكوفية — الأسعار ستُضاف لاحقًا.</div>
</footer>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal-panel" id="modalPanel">
    <div class="relative">
      <div id="modalImgWrap" style="aspect-ratio:4/3; overflow:hidden;">
        <img id="modalImg" src="" alt="" style="width:100%; height:100%; object-fit:cover;">
      </div>
      <button id="modalClose" style="position:absolute; top:12px; inset-inline-end:12px; width:34px; height:34px; border-radius:50%; background:rgba(16,13,12,0.6); border:1px solid var(--hairline); color:var(--sand); backdrop-filter:blur(8px);">✕</button>
    </div>
    <div class="p-6">
      <div id="modalCat" class="text-[11px] tracking-wide mb-1" style="color:var(--ember-light)"></div>
      <h3 id="modalName" class="display" style="font-size:24px; color:var(--sand); font-weight:600;"></h3>
      <div id="modalOriginal" class="mt-1 text-[13px]" style="color:var(--sand-dim)"></div>
      <p id="modalDesc" class="mt-3 text-[14px] leading-relaxed" style="color:var(--sand-dim)"></p>
    </div>
  </div>
</div>

<button class="cart-fab" id="cartFab" aria-label="cart">
  <span style="font-size:24px;">🛒</span>
  <span class="cart-badge" id="cartBadge" style="display:none;">0</span>
</button>

<div class="modal-backdrop" id="cartBackdrop">
  <div class="modal-panel" id="cartPanel">
    <div class="p-6">
      <div style="display:flex; align-items:center; justify-content:space-between;">
        <h3 id="cartTitle" class="display" style="font-size:22px; color:var(--sand); font-weight:600;"></h3>
        <button id="cartClose" style="width:32px; height:32px; border-radius:50%; background:rgba(16,13,12,0.6); border:1px solid var(--hairline); color:var(--sand);">✕</button>
      </div>
      <div id="cartItems" style="margin-top:10px;"></div>
      <div id="cartEmpty" style="display:none; text-align:center; padding:30px 0; color:var(--sand-dim); font-size:14px;"></div>
      <div style="margin-top:18px;">
        <label id="tableLabel" style="font-size:13px; color:var(--sand-dim);"></label>
        <input type="text" id="tableInput" class="table-input" inputmode="numeric">
      </div>
      <div style="display:flex; justify-content:space-between; align-items:center; margin-top:16px; font-size:16px;">
        <span id="totalLabel" style="color:var(--sand-dim);"></span>
        <span id="totalValue" class="display" style="font-weight:700; color:var(--sand); font-size:20px;"></span>
      </div>
      <button id="sendWhatsapp" class="whatsapp-btn">
        <span>📲</span><span id="sendLabel"></span>
      </button>
    </div>
  </div>
</div>

<script>
const MENU = [
  {
    id: 1,
    categories: ["main"],
    name: { ar: "صحن حمص", tr: "Humus Tabağı", en: "Hummus Plate" },
    description: { ar: "", tr: "", en: "" },
    image: "https://i.ibb.co/G4WGtZ1Y/Screenshot-1.jpg"
  },
  {
    id: 2,
    categories: ["main"],
    name: { ar: "صحن فول", tr: "Fava Tabağı", en: "Foul (Fava Bean) Plate" },
    description: { ar: "", tr: "", en: "" },
    image: "https://i.ibb.co/k23k5Vd0/Screenshot-1.jpg"
  },
  {
    id: 3,
    categories: ["main"],
    name: { ar: "صحن صدر دجاج مع بطاطا", tr: "Patatesli Tavuk Göğsü", en: "Chicken Breast with Potatoes" },
    description: { ar: "", tr: "", en: "" },
    image: "https://i.ibb.co/PGnQpNzb/Screenshot-1.jpg"
  },
  {
    id: 4,
    categories: ["main"],
    name: { ar: "صحن برجر مع بطاطا", tr: "Patatesli Burger", en: "Burger Plate with Potatoes" },
    description: { ar: "", tr: "", en: "" },
    image: "https://i.ibb.co/v4VKH17c/Screenshot-1.jpg"
  },
  {
    id: 5,
    categories: ["sandwich"],
    name: { ar: "ساندوتش شاورما", tr: "Şavarma Sandviç", en: "Shawarma Sandwich" },
    description: { ar: "", tr: "", en: "" },
    image: "https://i.ibb.co/ynZRGBvt/Screenshot-1.jpg"
  }
];

// سعر تجريبي عشوائي بين 3 و10 دولار لكل طبق
MENU.forEach(item => { item.price = Math.floor(Math.random() * 8) + 3; });

const CATEGORIES = [
  { id: "all",      label: { ar: "الكل",      tr: "Tümü",     en: "All" } },
  { id: "main",     label: { ar: "طبق رئيسي", tr: "Ana Yemek", en: "Main Course" } },
  { id: "sandwich", label: { ar: "ساندوتش",   tr: "Sandviç",  en: "Sandwich" } },
  { id: "drink",    label: { ar: "مشروبات",   tr: "İçecekler", en: "Drinks" } }
];

const TEXT = {
  ar: {
    brandName: "مطعم الكوفية", brandSub: "DEMO · القائمة الرقمية",
    heroTitle: "مذاق أصيل، بأسلوب عصري",
    heroSub: "تصفّح أطباقنا واختر ما يناسبك — عرض تجريبي للقائمة الرقمية.",
    view: "عرض الطبق",
    footer: "هذا عرض تجريبي لمطعم الكوفية — الأسعار تجريبية عشوائية لأغراض العرض فقط.",
    emptyTitle: "لا توجد أصناف بعد",
    emptySub: "سيتم إضافة قسم المشروبات قريبًا.",
    addToOrder: "إضافة إلى الطلب",
    cartTitle: "سلة الطلب",
    tableLabel: "رقم الطاولة",
    tablePlaceholder: "مثال: 5",
    totalLabel: "المجموع",
    sendWhatsapp: "إرسال الطلب عبر واتساب",
    emptyCart: "السلة فارغة",
    removeLabel: "حذف",
    tableRequired: "الرجاء إدخال رقم الطاولة"
  },
  tr: {
    brandName: "Al Koufieh Restaurant", brandSub: "DEMO · Dijital Menü",
    heroTitle: "Otantik Lezzet, Modern Sunum",
    heroSub: "Yemeklerimize göz atın — bu, dijital menünün bir demo sunumudur.",
    view: "Ürünü Gör",
    footer: "Bu, Al Koufieh Restaurant için bir demo sunumudur — fiyatlar yalnızca gösterim amaçlı rastgele belirlenmiştir.",
    emptyTitle: "Henüz ürün yok",
    emptySub: "İçecekler bölümü yakında eklenecek.",
    addToOrder: "Sepete Ekle",
    cartTitle: "Sepetiniz",
    tableLabel: "Masa Numarası",
    tablePlaceholder: "Örn: 5",
    totalLabel: "Toplam",
    sendWhatsapp: "WhatsApp ile Gönder",

    removeLabel: "Kaldır",
    tableRequired: "Lütfen masa numarasını girin"
  },
  en: {
    brandName: "Al Koufieh Restaurant", brandSub: "DEMO · Digital Menu",
    heroTitle: "Authentic Flavor, Modern Presentation",
    heroSub: "Browse our dishes and see what catches your eye — a demo of the digital menu.",
    view: "View Item",
    footer: "This is a demo presentation for Al Koufieh Restaurant — prices are random trial values for demo purposes only.",
    emptyTitle: "No items yet",
    emptySub: "The drinks section will be added soon.",
    addToOrder: "Add to Order",
    cartTitle: "Your Order",
    tableLabel: "Table Number",
    tablePlaceholder: "e.g. 5",
    totalLabel: "Total",
    sendWhatsapp: "Send Order via WhatsApp",
    emptyCart: "Your cart is empty",
    removeLabel: "Remove",
    tableRequired: "Please enter your table number"
  }
};

let currentLang = "ar";
let currentCat = "all";
let cart = {}; // { itemId: qty }

const el = (id) => document.getElementById(id);

function applyLangChrome(lang){
  const t = TEXT[lang];
  document.documentElement.setAttribute("lang", lang);
  document.documentElement.setAttribute("dir", lang === "ar" ? "rtl" : "ltr");
  document.documentElement.setAttribute("data-lang", lang);

  el("brandName").textContent = t.brandName;
  el("brandSub").textContent = t.brandSub;
  el("heroTitle").textContent = t.heroTitle;
  el("heroSub").textContent = t.heroSub;
  el("footerNote").textContent = t.footer;

  el("cartTitle").textContent = t.cartTitle;
  el("tableLabel").textContent = t.tableLabel;
  el("tableInput").placeholder = t.tablePlaceholder;
  el("totalLabel").textContent = t.totalLabel;
  el("sendLabel").textContent = t.sendWhatsapp;

  document.querySelectorAll(".lang-pill").forEach(btn=>{
    btn.classList.toggle("active", btn.dataset.lang === lang);
  });
}

function renderCategories(){
  const wrap = el("catScroll");
  wrap.innerHTML = "";
  CATEGORIES.forEach(cat=>{
    const btn = document.createElement("button");
    btn.className = "cat-pill" + (cat.id === currentCat ? " active" : "");
    btn.textContent = cat.label[currentLang];
    btn.addEventListener("click", ()=>{
      currentCat = cat.id;
      renderCategories();
      renderMenu();
    });
    wrap.appendChild(btn);
  });
}

function renderMenu(){
  const grid = el("menuGrid");
  grid.innerHTML = "";
  const t = TEXT[currentLang];
  const items = MENU.filter(m => currentCat === "all" || m.categories.includes(currentCat));

  if(items.length === 0){
    grid.innerHTML = `
      <div class="empty-state" style="grid-column:1 / -1;">
        <div class="empty-icon">☕</div>
        <div class="display" style="font-size:18px; color:var(--sand); font-weight:600;">${t.emptyTitle}</div>
        <p style="margin-top:6px; font-size:13.5px; color:var(--sand-dim);">${t.emptySub}</p>
      </div>
    `;
    return;
  }

  items.forEach((item, i)=>{
    const card = document.createElement("div");
    card.className = "card";
    card.style.animationDelay = (i * 0.08) + "s";

    const catLabel = item.categories
      .map(cid => CATEGORIES.find(c=>c.id===cid)?.label[currentLang])
      .filter(Boolean)
      .join(" · ");
    const desc = item.description[currentLang];

    card.innerHTML = `
      <div class="card-img-wrap">
        <img src="${item.image}" alt="${item.name[currentLang]}" loading="lazy">
        <button class="view-btn" data-id="${item.id}">
          <span>${t.view}</span>
        </button>
      </div>
      <div style="padding:16px 18px 20px;">
        <div style="font-size:11px; letter-spacing:.02em; color:var(--ember-light); margin-bottom:4px;">${catLabel}</div>
        <div class="display" style="font-size:19px; font-weight:600; color:var(--sand);">${item.name[currentLang]}</div>
        ${desc ? `<p style="margin-top:6px; font-size:13.5px; color:var(--sand-dim); line-height:1.5;">${desc}</p>` : ""}
        <div class="price">$${item.price}</div>
        <button class="add-btn" data-id="${item.id}">${t.addToOrder}</button>
      </div>
    `;
    card.querySelector(".view-btn").addEventListener("click", (e)=>{
      e.stopPropagation();
      op
